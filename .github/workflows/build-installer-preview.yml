name: Build Installer Preview

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[BUILD_INSTALLER_PREVIEW]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "4.0.0-preview.${{ github.run_number }}"
          $result = .\installer\Build-Installer.ps1 -Version $version
          "version=$($result.Version)" >> $env:GITHUB_OUTPUT
          "setup_path=$($result.Path)" >> $env:GITHUB_OUTPUT
          "sha256=$($result.Sha256)" >> $env:GITHUB_OUTPUT
          "size=$($result.Size)" >> $env:GITHUB_OUTPUT

      - name: Validate installer payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = '${{ steps.build.outputs.setup_path }}'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup EXE not found.' }
          if ((Get-Item -LiteralPath $setup).Length -lt 100000) { throw 'Setup EXE is unexpectedly small.' }

          $engine = [IO.File]::ReadAllText((Resolve-Path '.\src\ReleaseInstaller.ps1'))
          foreach ($forbidden in @('RSA_PRIVATE_KEY.txt','LoadOrCreateKey(','ExportCspBlob(true)')) {
            if ($engine.Contains($forbidden)) { throw "Private-key behavior found in release engine: $forbidden" }
          }

          $guiPath = Resolve-Path '.\src\ExtensionInstaller.ps1'
          $gui = [IO.File]::ReadAllText($guiPath)
          [void][scriptblock]::Create($gui)
          foreach ($forbidden in @('ExtensionInstaller.cmd','FolderBrowserDialog','UniversalExtensionBuilder','RSA_PRIVATE_KEY')) {
            if ($gui.Contains($forbidden)) { throw "Legacy behavior found in clean GUI: $forbidden" }
          }

          . .\src\ReleaseInstaller.ps1
          $catalog = Read-ExtensionCatalog '.\catalog\extensions.json'
          if (@($catalog.extensions).Count -ne 1) { throw 'Expected Network Recorder catalog entry.' }
          $entry = @($catalog.extensions)[0]
          if ([string]$entry.slug -cne 'network-recorder') { throw 'Unexpected catalog extension.' }
          if ([string]$entry.extension_id -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Pinned Extension ID changed.' }

          $checkRoot = Join-Path $env:RUNNER_TEMP 'extension-release-check'
          $resolved = Resolve-LatestSignedExtensionRelease $entry $checkRoot
          if ([string]$resolved.ExtensionId -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Resolved Extension ID changed.' }
          if (-not $resolved.Version) { throw 'Resolved version missing.' }
          if (-not (Test-Path -LiteralPath $resolved.CrxPath -PathType Leaf)) { throw 'Validated CRX missing.' }
          Remove-Item -LiteralPath $checkRoot -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "CLEAN_RELEASE_GUI_VALID $setup"

      - name: Smoke-test install, in-place reinstall, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = '${{ steps.build.outputs.setup_path }}'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\ExtensionInstaller'

          function Invoke-Setup([string]$PathValue) {
            $p = Start-Process -FilePath $PathValue -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)." }
          }

          Invoke-Setup $setup

          foreach ($name in @('ExtensionInstaller.ps1','ExtensionInstaller.vbs','ReleaseInstaller.ps1')) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed file missing: $path" }
          }
          $catalog = Join-Path $installDir 'catalog\extensions.json'
          if (-not (Test-Path -LiteralPath $catalog -PathType Leaf)) { throw "Installed catalog missing: $catalog" }

          # Re-run the same installer over the existing fixed-AppId installation.
          # This verifies the update-in-place path does not create a separate copy.
          Invoke-Setup $setup

          $dataDir = Join-Path $env:LOCALAPPDATA 'ExtensionInstaller'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir 'smoke-preserve.txt') -Value 'preserve'

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "Uninstaller missing: $uninstaller" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)." }
          if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw 'Silent uninstall unexpectedly removed user data.' }

          foreach ($name in @('ExtensionInstaller.ps1','ExtensionInstaller.vbs','ReleaseInstaller.ps1')) {
            if (Test-Path -LiteralPath (Join-Path $installDir $name) -PathType Leaf) { throw "Installed file remained after uninstall: $name" }
          }

          # Reinstall once more and explicitly exercise the full-cleanup path.
          Invoke-Setup $setup
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir 'smoke-delete.txt') -Value 'delete'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/REMOVEUSERDATA=1') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Cleanup uninstall failed with exit code $($u.ExitCode)." }
          if (Test-Path -LiteralPath $dataDir) { throw 'Explicit cleanup uninstall did not remove user data.' }

          Write-Host 'INSTALL_REINSTALL_UNINSTALL_DATA_POLICY_SMOKE_VALID'

      - name: Publish prerelease directly
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "installer-preview-${{ github.run_number }}"
          $title = "ExtensionInstaller ${{ steps.build.outputs.version }}"
          $notes = @"
          Installable preview of ExtensionInstaller.

          - per-user installation
          - fixed AppId for in-place upgrades
          - installs to %LOCALAPPDATA%\Programs\ExtensionInstaller
          - no GitHub Actions artifacts are retained
          - SHA-256: ${{ steps.build.outputs.sha256 }}

          This preview contains only the clean catalog -> signed GitHub Release -> verified CRX workflow. Local extension folders, ZIP selection and local RSA signing are not part of the application.
          "@

          gh release create $tag '${{ steps.build.outputs.setup_path }}' --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          $url = gh release view $tag --json url -q .url
          "release_url=$url" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Report
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if ($env:RESULT -eq 'success') {
            $body = "INSTALLER_PREVIEW_READY`nVersion: $env:VERSION`nSHA-256: $env:SHA256`n$env:RELEASE_URL"
          } else {
            $body = "INSTALLER_PREVIEW_FAILED"
          }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" -f body="$body"
