name: Build Installer Preview

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[BUILD_INSTALLER_PREVIEW]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "4.0.0-preview.${{ github.run_number }}"
          $result = .\installer\Build-Installer.ps1 -Version $version
          "version=$($result.Version)" >> $env:GITHUB_OUTPUT
          "setup_path=$($result.Path)" >> $env:GITHUB_OUTPUT
          "sha256=$($result.Sha256)" >> $env:GITHUB_OUTPUT
          "size=$($result.Size)" >> $env:GITHUB_OUTPUT

      - name: Validate installer payload
        shell: powershell
        env:
          EXTENSION_INSTALLER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = '${{ steps.build.outputs.setup_path }}'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup EXE not found.' }
          if ((Get-Item -LiteralPath $setup).Length -lt 100000) { throw 'Setup EXE is unexpectedly small.' }

          $engine = [IO.File]::ReadAllText((Resolve-Path '.\src\ReleaseInstaller.ps1'))
          foreach ($forbidden in @('RSA_PRIVATE_KEY.txt','LoadOrCreateKey(','ExportCspBlob(true)')) {
            if ($engine.Contains($forbidden)) { throw "Private-key behavior found in release engine: $forbidden" }
          }

          $guiPath = Resolve-Path '.\src\ExtensionInstaller.ps1'
          $guiBytes = [IO.File]::ReadAllBytes($guiPath)
          if ($guiBytes.Length -lt 3 -or $guiBytes[0] -ne 0xEF -or $guiBytes[1] -ne 0xBB -or $guiBytes[2] -ne 0xBF) {
            throw 'ExtensionInstaller.ps1 must carry UTF-8 BOM for Windows PowerShell 5.1.'
          }
          $gui = [IO.File]::ReadAllText($guiPath)
          [void][scriptblock]::Create($gui)
          foreach ($forbidden in @('ExtensionInstaller.cmd','FolderBrowserDialog','UniversalExtensionBuilder','RSA_PRIVATE_KEY')) {
            if ($gui.Contains($forbidden)) { throw "Legacy behavior found in clean GUI: $forbidden" }
          }

          . .\src\ReleaseInstaller.ps1

          $testId = 'paolfcaakecapidipfcfbbhgkpcmgcip'
          $fakeUserData = Join-Path $env:RUNNER_TEMP ('fake-yandex-' + [Guid]::NewGuid().ToString('N'))
          $fakeDefault = Join-Path $fakeUserData 'Default'
          $fakeExtension = Join-Path (Join-Path (Join-Path $fakeDefault 'Extensions') $testId) '1.6.0_0'
          New-Item -ItemType Directory -Path $fakeExtension -Force | Out-Null
          $fakePreferences = Join-Path $fakeDefault 'Preferences'
          [IO.File]::WriteAllText(
            $fakePreferences,
            ('{"extensions":{"external_uninstalls":["' + $testId + '","aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]}}'),
            (New-Object Text.UTF8Encoding($false))
          )
          $fakeSecurePreferences = Join-Path $fakeDefault 'Secure Preferences'
          [IO.File]::WriteAllText(
            $fakeSecurePreferences,
            ('{"extensions":{"settings":{"' + $testId + '":{"manifest":{"version":"1.6.0"}}}}}'),
            (New-Object Text.UTF8Encoding($false))
          )

          $profileInstalls = @(Get-ReleaseYandexProfileInstallations $testId $fakeUserData)
          if ($profileInstalls.Count -ne 1 -or [string]$profileInstalls[0].Version -cne '1.6.0') {
            throw 'Browser-profile installation detection failed.'
          }

          Remove-Item -LiteralPath $fakeSecurePreferences -Force
          $staleDirectoryOnly = @(Get-ReleaseYandexProfileInstallations $testId $fakeUserData)
          if ($staleDirectoryOnly.Count -ne 0) {
            throw 'Stale extension directory was incorrectly treated as an installed browser extension.'
          }

          [IO.File]::WriteAllText(
            $fakeSecurePreferences,
            ('{"extensions":{"settings":{"' + $testId + '":{"manifest":{"version":"1.6.0"}}}}}'),
            (New-Object Text.UTF8Encoding($false))
          )

          $blockedProfiles = @(Get-ReleaseYandexExternalUninstallProfiles $testId $fakeUserData)
          if ($blockedProfiles.Count -ne 1) { throw 'External-uninstall detection failed.' }

          $prefBackups = @(Remove-ReleaseYandexExternalUninstallMarker $testId $fakeUserData)
          if ($prefBackups.Count -ne 1) { throw 'External-uninstall marker was not cleared.' }
          $prefsAfter = [IO.File]::ReadAllText($fakePreferences) | ConvertFrom-Json
          if (@($prefsAfter.extensions.external_uninstalls | Where-Object { [string]$_ -ceq $testId }).Count -ne 0) {
            throw 'Target external-uninstall marker remained.'
          }
          if (@($prefsAfter.extensions.external_uninstalls | Where-Object { [string]$_ -ceq 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }).Count -ne 1) {
            throw 'Unrelated external-uninstall marker was modified.'
          }

          Restore-ReleaseYandexPreferenceBackups $prefBackups
          $prefsRestored = [IO.File]::ReadAllText($fakePreferences) | ConvertFrom-Json
          if (@($prefsRestored.extensions.external_uninstalls | Where-Object { [string]$_ -ceq $testId }).Count -ne 1) {
            throw 'Preferences rollback failed.'
          }

          $registryTestRoot = 'HKCU:\Software\ExtensionInstaller-CI-' + [Guid]::NewGuid().ToString('N') + '\Extensions'
          $registryTestCrx = Join-Path $env:RUNNER_TEMP ('registry-pulse-' + [Guid]::NewGuid().ToString('N') + '.crx')
          Set-Content -LiteralPath $registryTestCrx -Value 'fixture' -Encoding ASCII
          New-Item -Path (Join-Path $registryTestRoot $testId) -Force | Out-Null
          New-ItemProperty -LiteralPath (Join-Path $registryTestRoot $testId) -Name 'path' -PropertyType String -Value 'C:\old\legacy.crx' -Force | Out-Null
          New-ItemProperty -LiteralPath (Join-Path $registryTestRoot $testId) -Name 'version' -PropertyType String -Value '1.5.0' -Force | Out-Null

          $pulse = Set-ReleaseYandexRegistrationFresh -ExtensionId $testId -CrxPath $registryTestCrx -Version '1.6.0' -BaseKey $registryTestRoot -BrowserRunningOverride $true -PulseDelayMilliseconds 0
          if (-not $pulse.HadRegistration -or -not $pulse.Pulsed) { throw 'Live registry re-registration pulse was not reported.' }
          $pulseValues = Get-ItemProperty -LiteralPath (Join-Path $registryTestRoot $testId)
          if ([string]$pulseValues.path -cne $registryTestCrx -or [string]$pulseValues.version -cne '1.6.0') {
            throw 'Live registry re-registration pulse wrote incorrect values.'
          }
          Remove-Item -LiteralPath ($registryTestRoot -replace '\\Extensions Join-Path (Join-Path (Join-Path (Join-Path $env:LOCALAPPDATA 'UniversalExtensionBuilder') 'projects') $testId) 'crx'
          $legacyProbe = [pscustomobject]@{ Path = (Join-Path $legacyPath 'legacy.crx'); Version = '1.6.0' }
          if (-not (Test-ReleaseLegacyYandexRegistration $legacyProbe $testId)) {
            throw 'Legacy ExtensionInstaller registration was not recognized.'
          }
          $foreignProbe = [pscustomobject]@{ Path = (Join-Path $env:RUNNER_TEMP 'foreign.crx'); Version = '1.6.0' }
          if (Test-ReleaseLegacyYandexRegistration $foreignProbe $testId) {
            throw 'Foreign registration was incorrectly recognized as legacy-owned.'
          }
          Remove-Item -LiteralPath $fakeUserData -Recurse -Force -ErrorAction SilentlyContinue

          $catalog = Read-ExtensionCatalog '.\catalog\extensions.json'
          if (@($catalog.extensions).Count -ne 1) { throw 'Expected Network Recorder catalog entry.' }
          $entry = @($catalog.extensions)[0]
          if ([string]$entry.slug -cne 'network-recorder') { throw 'Unexpected catalog extension.' }
          if ([string]$entry.extension_id -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Pinned Extension ID changed.' }

          $checkRoot = Join-Path $env:RUNNER_TEMP 'extension-release-check'
          $resolved = Resolve-LatestSignedExtensionRelease $entry $checkRoot
          if ([string]$resolved.ExtensionId -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Resolved Extension ID changed.' }
          if (-not $resolved.Version) { throw 'Resolved version missing.' }
          if (-not (Test-Path -LiteralPath $resolved.CrxPath -PathType Leaf)) { throw 'Validated CRX missing.' }
          Remove-Item -LiteralPath $checkRoot -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "CLEAN_RELEASE_GUI_VALID $setup"

      - name: Smoke-test install, in-place reinstall, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = '${{ steps.build.outputs.setup_path }}'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\ExtensionInstaller'

          function Invoke-Setup([string]$PathValue) {
            $p = Start-Process -FilePath $PathValue -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)." }
          }

          Invoke-Setup $setup

          foreach ($name in @('ExtensionInstaller.ps1','ExtensionInstaller.vbs','ReleaseInstaller.ps1')) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed file missing: $path" }
          }
          $catalog = Join-Path $installDir 'catalog\extensions.json'
          if (-not (Test-Path -LiteralPath $catalog -PathType Leaf)) { throw "Installed catalog missing: $catalog" }

          # Simulate an obsolete file left by the previous legacy build, then
          # run the same fixed-AppId installer over the existing installation.
          $obsoleteCmd = Join-Path $installDir 'ExtensionInstaller.cmd'
          Set-Content -LiteralPath $obsoleteCmd -Value 'obsolete legacy file' -Encoding ASCII
          if (-not (Test-Path -LiteralPath $obsoleteCmd -PathType Leaf)) { throw 'Failed to seed obsolete CMD for upgrade test.' }

          Invoke-Setup $setup

          if (Test-Path -LiteralPath $obsoleteCmd -PathType Leaf) {
            throw 'Upgrade did not remove obsolete ExtensionInstaller.cmd.'
          }

          $dataDir = Join-Path $env:LOCALAPPDATA 'ExtensionInstaller'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir 'smoke-preserve.txt') -Value 'preserve'

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "Uninstaller missing: $uninstaller" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)." }
          if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw 'Silent uninstall unexpectedly removed user data.' }

          foreach ($name in @('ExtensionInstaller.ps1','ExtensionInstaller.vbs','ReleaseInstaller.ps1')) {
            if (Test-Path -LiteralPath (Join-Path $installDir $name) -PathType Leaf) { throw "Installed file remained after uninstall: $name" }
          }

          # Reinstall once more and explicitly exercise the full-cleanup path.
          Invoke-Setup $setup
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir 'smoke-delete.txt') -Value 'delete'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/REMOVEUSERDATA=1') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Cleanup uninstall failed with exit code $($u.ExitCode)." }
          if (Test-Path -LiteralPath $dataDir) { throw 'Explicit cleanup uninstall did not remove user data.' }

          Write-Host 'INSTALL_REINSTALL_UNINSTALL_DATA_POLICY_SMOKE_VALID'

      - name: Publish prerelease directly
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "installer-preview-${{ github.run_number }}"
          $title = "ExtensionInstaller ${{ steps.build.outputs.version }}"
          $notes = @"
          Installable preview of ExtensionInstaller.

          - per-user installation
          - fixed AppId for in-place upgrades
          - installs to %LOCALAPPDATA%\Programs\ExtensionInstaller
          - no GitHub Actions artifacts are retained
          - SHA-256: ${{ steps.build.outputs.sha256 }}

          This preview contains only the clean catalog -> signed GitHub Release -> verified CRX workflow. Local extension folders, ZIP selection and local RSA signing are not part of the application.
          "@

          gh release create $tag '${{ steps.build.outputs.setup_path }}' --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          $url = gh release view $tag --json url -q .url
          "release_url=$url" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Report
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if ($env:RESULT -eq 'success') {
            $body = "INSTALLER_PREVIEW_READY`nVersion: $env:VERSION`nSHA-256: $env:SHA256`n$env:RELEASE_URL"
          } else {
            $body = "INSTALLER_PREVIEW_FAILED"
          }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" -f body="$body"
,'') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $registryTestCrx -Force -ErrorAction SilentlyContinue

          $legacyPath = Join-Path (Join-Path (Join-Path (Join-Path $env:LOCALAPPDATA 'UniversalExtensionBuilder') 'projects') $testId) 'crx'
          $legacyProbe = [pscustomobject]@{ Path = (Join-Path $legacyPath 'legacy.crx'); Version = '1.6.0' }
          if (-not (Test-ReleaseLegacyYandexRegistration $legacyProbe $testId)) {
            throw 'Legacy ExtensionInstaller registration was not recognized.'
          }
          $foreignProbe = [pscustomobject]@{ Path = (Join-Path $env:RUNNER_TEMP 'foreign.crx'); Version = '1.6.0' }
          if (Test-ReleaseLegacyYandexRegistration $foreignProbe $testId) {
            throw 'Foreign registration was incorrectly recognized as legacy-owned.'
          }
          Remove-Item -LiteralPath $fakeUserData -Recurse -Force -ErrorAction SilentlyContinue

          $catalog = Read-ExtensionCatalog '.\catalog\extensions.json'
          if (@($catalog.extensions).Count -ne 1) { throw 'Expected Network Recorder catalog entry.' }
          $entry = @($catalog.extensions)[0]
          if ([string]$entry.slug -cne 'network-recorder') { throw 'Unexpected catalog extension.' }
          if ([string]$entry.extension_id -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Pinned Extension ID changed.' }

          $checkRoot = Join-Path $env:RUNNER_TEMP 'extension-release-check'
          $resolved = Resolve-LatestSignedExtensionRelease $entry $checkRoot
          if ([string]$resolved.ExtensionId -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Resolved Extension ID changed.' }
          if (-not $resolved.Version) { throw 'Resolved version missing.' }
          if (-not (Test-Path -LiteralPath $resolved.CrxPath -PathType Leaf)) { throw 'Validated CRX missing.' }
          Remove-Item -LiteralPath $checkRoot -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "CLEAN_RELEASE_GUI_VALID $setup"

      - name: Smoke-test install, in-place reinstall, and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = '${{ steps.build.outputs.setup_path }}'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\ExtensionInstaller'

          function Invoke-Setup([string]$PathValue) {
            $p = Start-Process -FilePath $PathValue -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)." }
          }

          Invoke-Setup $setup

          foreach ($name in @('ExtensionInstaller.ps1','ExtensionInstaller.vbs','ReleaseInstaller.ps1')) {
            $path = Join-Path $installDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed file missing: $path" }
          }
          $catalog = Join-Path $installDir 'catalog\extensions.json'
          if (-not (Test-Path -LiteralPath $catalog -PathType Leaf)) { throw "Installed catalog missing: $catalog" }

          # Simulate an obsolete file left by the previous legacy build, then
          # run the same fixed-AppId installer over the existing installation.
          $obsoleteCmd = Join-Path $installDir 'ExtensionInstaller.cmd'
          Set-Content -LiteralPath $obsoleteCmd -Value 'obsolete legacy file' -Encoding ASCII
          if (-not (Test-Path -LiteralPath $obsoleteCmd -PathType Leaf)) { throw 'Failed to seed obsolete CMD for upgrade test.' }

          Invoke-Setup $setup

          if (Test-Path -LiteralPath $obsoleteCmd -PathType Leaf) {
            throw 'Upgrade did not remove obsolete ExtensionInstaller.cmd.'
          }

          $dataDir = Join-Path $env:LOCALAPPDATA 'ExtensionInstaller'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir 'smoke-preserve.txt') -Value 'preserve'

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw "Uninstaller missing: $uninstaller" }
          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($u.ExitCode)." }
          if (-not (Test-Path -LiteralPath $dataDir -PathType Container)) { throw 'Silent uninstall unexpectedly removed user data.' }

          foreach ($name in @('ExtensionInstaller.ps1','ExtensionInstaller.vbs','ReleaseInstaller.ps1')) {
            if (Test-Path -LiteralPath (Join-Path $installDir $name) -PathType Leaf) { throw "Installed file remained after uninstall: $name" }
          }

          # Reinstall once more and explicitly exercise the full-cleanup path.
          Invoke-Setup $setup
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dataDir 'smoke-delete.txt') -Value 'delete'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/REMOVEUSERDATA=1') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Cleanup uninstall failed with exit code $($u.ExitCode)." }
          if (Test-Path -LiteralPath $dataDir) { throw 'Explicit cleanup uninstall did not remove user data.' }

          Write-Host 'INSTALL_REINSTALL_UNINSTALL_DATA_POLICY_SMOKE_VALID'

      - name: Publish prerelease directly
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "installer-preview-${{ github.run_number }}"
          $title = "ExtensionInstaller ${{ steps.build.outputs.version }}"
          $notes = @"
          Installable preview of ExtensionInstaller.

          - per-user installation
          - fixed AppId for in-place upgrades
          - installs to %LOCALAPPDATA%\Programs\ExtensionInstaller
          - no GitHub Actions artifacts are retained
          - SHA-256: ${{ steps.build.outputs.sha256 }}

          This preview contains only the clean catalog -> signed GitHub Release -> verified CRX workflow. Local extension folders, ZIP selection and local RSA signing are not part of the application.
          "@

          gh release create $tag '${{ steps.build.outputs.setup_path }}' --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          $url = gh release view $tag --json url -q .url
          "release_url=$url" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Report
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if ($env:RESULT -eq 'success') {
            $body = "INSTALLER_PREVIEW_READY`nVersion: $env:VERSION`nSHA-256: $env:SHA256`n$env:RELEASE_URL"
          } else {
            $body = "INSTALLER_PREVIEW_FAILED"
          }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" -f body="$body"
