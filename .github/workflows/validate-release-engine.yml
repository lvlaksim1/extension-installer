name: Validate Release Engine

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event.issue.user.login == 'lvlaksim1' && github.event.issue.title == '[VALIDATE_RELEASE_ENGINE]'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell 5.1 release engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\ReleaseInstaller.ps1

          $testId = 'paolfcaakecapidipfcfbbhgkpcmgcip'
          $fakeUserData = Join-Path $env:RUNNER_TEMP ('fake-yandex-' + [Guid]::NewGuid().ToString('N'))
          $fakeDefault = Join-Path $fakeUserData 'Default'
          $fakeExtension = Join-Path (Join-Path (Join-Path $fakeDefault 'Extensions') $testId) '1.6.0_0'
          New-Item -ItemType Directory -Path $fakeExtension -Force | Out-Null
          $fakePreferences = Join-Path $fakeDefault 'Preferences'
          [IO.File]::WriteAllText(
            $fakePreferences,
            ('{"extensions":{"external_uninstalls":["' + $testId + '","aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]}}'),
            (New-Object Text.UTF8Encoding($false))
          )
          $fakeSecurePreferences = Join-Path $fakeDefault 'Secure Preferences'
          [IO.File]::WriteAllText(
            $fakeSecurePreferences,
            ('{"extensions":{"settings":{"' + $testId + '":{"manifest":{"version":"1.6.0"}}}}}'),
            (New-Object Text.UTF8Encoding($false))
          )

          $profileInstalls = @(Get-ReleaseYandexProfileInstallations $testId $fakeUserData)
          if ($profileInstalls.Count -ne 1 -or [string]$profileInstalls[0].Version -cne '1.6.0') {
            throw 'Browser-profile installation detection failed.'
          }

          Remove-Item -LiteralPath $fakeSecurePreferences -Force
          $staleDirectoryOnly = @(Get-ReleaseYandexProfileInstallations $testId $fakeUserData)
          if ($staleDirectoryOnly.Count -ne 0) {
            throw 'Stale extension directory was incorrectly treated as an installed browser extension.'
          }

          [IO.File]::WriteAllText(
            $fakeSecurePreferences,
            ('{"extensions":{"settings":{"' + $testId + '":{"manifest":{"version":"1.6.0"}}}}}'),
            (New-Object Text.UTF8Encoding($false))
          )

          $blockedProfiles = @(Get-ReleaseYandexExternalUninstallProfiles $testId $fakeUserData)
          if ($blockedProfiles.Count -ne 1) { throw 'External-uninstall detection failed.' }

          $state2Preferences = Join-Path $fakeDefault 'Secure Preferences'
          [IO.File]::WriteAllText(
            $state2Preferences,
            ('{"extensions":{"settings":{"' + $testId + '":{"state":2,"manifest":{"version":"1.6.0"}}}}}'),
            (New-Object Text.UTF8Encoding($false))
          )
          $state2Profiles = @(Get-ReleaseYandexProfileInstallations $testId $fakeUserData)
          if ($state2Profiles.Count -ne 1 -or -not [bool]$state2Profiles[0].IsExternalUninstalled -or [int]$state2Profiles[0].State -ne 2) {
            throw 'EXTERNAL_EXTENSION_UNINSTALLED state detection failed.'
          }
          $state2Blocked = @(Get-ReleaseYandexExternalUninstallProfiles $testId $fakeUserData)
          if ($state2Blocked.Count -ne 1) { throw 'State=2 was not treated as external uninstall.' }

          [IO.File]::WriteAllText(
            $fakeSecurePreferences,
            ('{"extensions":{"settings":{"' + $testId + '":{"state":1,"manifest":{"version":"1.6.0"}}}}}'),
            (New-Object Text.UTF8Encoding($false))
          )



          $prefBackups = @(Remove-ReleaseYandexExternalUninstallMarker $testId $fakeUserData)
          if ($prefBackups.Count -ne 1) { throw 'External-uninstall marker was not cleared.' }
          $prefsAfter = [IO.File]::ReadAllText($fakePreferences) | ConvertFrom-Json
          if (@($prefsAfter.extensions.external_uninstalls | Where-Object { [string]$_ -ceq $testId }).Count -ne 0) {
            throw 'Target external-uninstall marker remained.'
          }
          if (@($prefsAfter.extensions.external_uninstalls | Where-Object { [string]$_ -ceq 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }).Count -ne 1) {
            throw 'Unrelated external-uninstall marker was modified.'
          }

          Restore-ReleaseYandexPreferenceBackups $prefBackups
          $prefsRestored = [IO.File]::ReadAllText($fakePreferences) | ConvertFrom-Json
          if (@($prefsRestored.extensions.external_uninstalls | Where-Object { [string]$_ -ceq $testId }).Count -ne 1) {
            throw 'Preferences rollback failed.'
          }

          $registryTestBase = 'HKCU:\Software\ExtensionInstaller-CI-' + [Guid]::NewGuid().ToString('N')
          $registryTestRoot = Join-Path $registryTestBase 'Extensions'
          $registryTestCrx = Join-Path $env:RUNNER_TEMP ('registry-pulse-' + [Guid]::NewGuid().ToString('N') + '.crx')
          Set-Content -LiteralPath $registryTestCrx -Value 'fixture' -Encoding ASCII
          New-Item -Path (Join-Path $registryTestRoot $testId) -Force | Out-Null
          New-ItemProperty -LiteralPath (Join-Path $registryTestRoot $testId) -Name 'path' -PropertyType String -Value 'C:\old\legacy.crx' -Force | Out-Null
          New-ItemProperty -LiteralPath (Join-Path $registryTestRoot $testId) -Name 'version' -PropertyType String -Value '1.5.0' -Force | Out-Null

          $registration = Set-ReleaseYandexRegistration -ExtensionId $testId -CrxPath $registryTestCrx -Version '1.6.0' -BaseKey $registryTestRoot -BrowserRunningOverride $true
          if (-not $registration.HadRegistration -or -not $registration.InPlace -or -not $registration.ValuesChanged) {
            throw 'v3-style in-place registration was not reported correctly.'
          }
          $registrationValues = Get-ItemProperty -LiteralPath (Join-Path $registryTestRoot $testId)
          if ([string]$registrationValues.path -cne $registryTestCrx -or [string]$registrationValues.version -cne '1.6.0') {
            throw 'v3-style in-place registration wrote incorrect values.'
          }
          Remove-Item -LiteralPath $registryTestBase -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $registryTestCrx -Force -ErrorAction SilentlyContinue

          if (Test-ReleaseYandexLiveResetRequired -BrowserRunning $true -BlockedProfileCount 0 -ActiveProfileCount 3 -HasOldRegistration $true) {
            throw 'Active same-version reinstall incorrectly requested a live reset.'
          }
          if (-not (Test-ReleaseYandexLiveResetRequired -BrowserRunning $true -BlockedProfileCount 1 -ActiveProfileCount 3 -HasOldRegistration $true)) {
            throw 'Blocked reinstall did not request a live reset.'
          }
          if (-not (Test-ReleaseYandexLiveResetRequired -BrowserRunning $true -BlockedProfileCount 0 -ActiveProfileCount 0 -HasOldRegistration $true)) {
            throw 'Missing active browser profile did not request recovery reset.'
          }
          if (Test-ReleaseYandexLiveResetRequired -BrowserRunning $false -BlockedProfileCount 1 -ActiveProfileCount 0 -HasOldRegistration $true) {
            throw 'Closed browser incorrectly requested a live reset.'
          }


          $ownershipRoot = Join-Path $env:RUNNER_TEMP ('ownership-' + [Guid]::NewGuid().ToString('N'))
          $ownershipPath = Join-Path $ownershipRoot 'ownership.json'
          $ownershipState = [pscustomobject]@{
            ExtensionId = $testId
            Version = '1.6.0'
            CrxPath = (Join-Path $ownershipRoot 'managed.crx')
            SourceRepository = 'lvlaksim1/network-recorder'
          }
          $writtenOwnership = Write-ReleaseOwnershipMarker $ownershipPath $testId $ownershipState $null
          if (-not (Test-Path -LiteralPath $ownershipPath -PathType Leaf)) { throw 'Ownership marker was not persisted.' }
          $readOwnership = Read-ReleaseOwnershipMarker $ownershipPath
          if ($null -eq $readOwnership -or [string]$readOwnership.ExtensionId -cne $testId -or [string]$readOwnership.LastVersion -cne '1.6.0') {
            throw 'Ownership marker round-trip failed.'
          }
          Remove-Item -LiteralPath $ownershipRoot -Recurse -Force -ErrorAction SilentlyContinue

          $legacyPath = Join-Path (Join-Path (Join-Path (Join-Path $env:LOCALAPPDATA 'UniversalExtensionBuilder') 'projects') $testId) 'crx'
          $legacyProbe = [pscustomobject]@{ Path = (Join-Path $legacyPath 'legacy.crx'); Version = '1.6.0' }
          if (-not (Test-ReleaseLegacyYandexRegistration $legacyProbe $testId)) {
            throw 'Legacy ExtensionInstaller registration was not recognized.'
          }
          $foreignProbe = [pscustomobject]@{ Path = (Join-Path $env:RUNNER_TEMP 'foreign.crx'); Version = '1.6.0' }
          if (Test-ReleaseLegacyYandexRegistration $foreignProbe $testId) {
            throw 'Foreign registration was incorrectly recognized as legacy-owned.'
          }
          Remove-Item -LiteralPath $fakeUserData -Recurse -Force -ErrorAction SilentlyContinue

          Initialize-Crx3PackageInspector
          Initialize-ReleaseYandexWindowBridge
          if (-not ("ExtensionInstallerYandexWindowBridge" -as [type])) { throw 'Yandex window activation bridge did not compile.' }

          $catalog = Read-ExtensionCatalog '.\catalog\extensions.json'
          if ($catalog.schema_version -ne 1) { throw 'Unexpected catalog schema version.' }

          $source = [IO.File]::ReadAllText((Resolve-Path '.\src\ReleaseInstaller.ps1'))
          foreach ($forbidden in @('RSA_PRIVATE_KEY.txt','ExportCspBlob(true)','LoadOrCreateKey(')) {
            if ($source.Contains($forbidden)) { throw "Private-key behavior leaked into release engine: $forbidden" }
          }

          Write-Host 'RELEASE_ENGINE_VALID'

      - name: Validate published Network Recorder prerelease
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\src\ReleaseInstaller.ps1
          Initialize-Crx3PackageInspector

          $root = Join-Path $env:RUNNER_TEMP 'network-recorder-prerelease'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $crx = Join-Path $root 'Network_Recorder_v1.6.0.crx'
          $descriptorPath = Join-Path $root 'extension-release.json'

          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/lvlaksim1/network-recorder/releases/download/network-recorder-v1.6.0-preview-1/Network_Recorder_v1.6.0.crx' -OutFile $crx
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/lvlaksim1/network-recorder/releases/download/network-recorder-v1.6.0-preview-1/extension-release.json' -OutFile $descriptorPath

          $descriptor = Read-ExtensionReleaseDescriptor $descriptorPath
          if ([string]$descriptor.slug -cne 'network-recorder') { throw 'Unexpected slug.' }
          if ([string]$descriptor.version -cne '1.6.0') { throw 'Unexpected version.' }
          if ([string]$descriptor.extension_id -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Descriptor Extension ID mismatch.' }

          $actualSha = Get-ReleaseFileSha256 $crx
          if ($actualSha -cne ([string]$descriptor.crx_sha256).ToLowerInvariant()) { throw 'Published CRX SHA-256 mismatch.' }

          $inspection = [Crx3PackageInspector]::Inspect($crx)
          if (-not $inspection.SignatureValid) { throw 'Published CRX3 signature invalid.' }
          if ([string]$inspection.ExtensionId -cne 'paolfcaakecapidipfcfbbhgkpcmgcip') { throw 'Published CRX Extension ID mismatch.' }

          Write-Host ('NETWORK_RECORDER_RELEASE_VALID ID=' + $inspection.ExtensionId + ' SHA256=' + $actualSha)

      - name: Report
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
        run: |
          if ($env:RESULT -eq 'success') { $body = 'RELEASE_ENGINE_VALID' } else { $body = 'RELEASE_ENGINE_INVALID' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/$env:ISSUE_NUMBER/comments" -f body="$body"
